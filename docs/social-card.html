<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:627px;background:#0e1a24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;padding:64px 64px 56px;overflow:hidden}
.eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#45d39b}
h1{font-size:92px;line-height:.95;font-weight:800;letter-spacing:-.02em;margin:22px 0 26px}
p{font-size:30px;line-height:1.3;color:#c9d3dc;max-width:560px}
.bul{margin-top:34px;display:grid;gap:12px;font-size:23px;color:#e9eef2}
.bul span{display:flex;gap:12px;align-items:center}.bul i{width:12px;height:12px;border-radius:50%;background:#45d39b;display:inline-block}
.ui{align-self:center;display:grid;gap:16px}
.search{background:#16273a;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{background:#45d39b;color:#062a1e;font-weight:700;font-size:19px;border-radius:999px;padding:5px 14px}
.place{color:#c9d3dc;font-size:19px;margin-right:6px}
.card{background:#fff;color:#0e1a24;border-radius:14px;padding:20px 22px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h3{font-size:24px}.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:16px;color:#5d6b78;align-items:center}
.chip{background:#e2f3ec;color:#0b7a5b;font-weight:700;border-radius:999px;padding:3px 11px;font-size:15px}
.chip.dark{background:#0e1a24;color:#fff}.st{border:2px solid #0b7a5b;border-radius:7px;padding:5px 12px;font-weight:700;font-size:16px;color:#0b7a5b;width:max-content}
.card.b{opacity:.9;transform:translateX(26px)}
</style></head><body>
<div><div class="eyebrow" id="eb"></div><h1>Job Finder</h1><p id="tag"></p><div class="bul" id="bul"></div></div>
<div class="ui">
  <div class="search"><span class="place" id="pl"></span><span class="tok" id="k1"></span><span class="tok">FMEA</span><span class="tok" id="k3"></span></div>
  <div class="card"><h3 id="r1"></h3><div class="meta"><span class="chip" id="m1"></span><span class="chip">FMEA</span><span id="d1"></span></div><div class="st" id="s1"></div></div>
  <div class="card b"><h3 id="r2"></h3><div class="meta"><span class="chip dark" id="n2"></span><span id="d2"></span></div></div>
</div>
<script>
const T = { sv: { eb: "Gratis · Utan konto", tag: "Sök lediga jobb i hela Sverige och se vilka arbetsgivare som anställer.", bul: ["Platsbanken och andra jobbsajter", "Sök på ort, avstånd och egna sökord", "Håll koll på dina ansökningar"], pl: "Göteborg + 25 km", k1: "kvalitetsingenjör", k3: "lean", r1: "Kvalitetsingenjör, medicinteknik", m1: "kvalitetsingenjör", d1: "Sök senast 4 nov", s1: "Sökt", r2: "Processingenjör till fordonsindustrin", n2: "Ny", d2: "Publicerad i dag" },
  en: { eb: "Free · No account needed", tag: "Search open jobs across Sweden and see which employers are hiring.", bul: ["Platsbanken and other job sites", "Search by place, distance and your own keywords", "Keep track of your applications"], pl: "Göteborg + 25 km", k1: "quality engineer", k3: "lean", r1: "Quality Engineer, medical devices", m1: "quality engineer", d1: "Apply by 4 Nov", s1: "Applied", r2: "Process Engineer, automotive", n2: "New", d2: "Posted today" } }[location.hash.slice(1) || "sv"];
for (const [k, v] of Object.entries(T)) { const el = document.getElementById(k); if (!el) continue; if (Array.isArray(v)) el.innerHTML = v.map(x => `<span><i></i>${x}</span>`).join(""); else el.textContent = v; }
</script></body></html>
